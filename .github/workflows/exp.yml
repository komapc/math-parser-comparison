name: exp-nest
on:
  pull_request:
    paths: [ "exp/**", ".github/workflows/exp.yml" ]
jobs:
  ab:
    runs-on: ubuntu-latest
    strategy:
      matrix: { rep: [1, 2, 3, 4, 5, 6] }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y g++-14
      - run: python3 bench/gen_corpus.py
      - name: build base and v3
        run: |
          cmake -S cpp -B base -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 && cmake --build base -j --target corpus_bench adversarial_bench
          cp exp/fold_v3.cpp cpp/src/multipass_reverse_fold.cpp
          cmake -S cpp -B v3 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 && cmake --build v3 -j --target corpus_bench adversarial_bench
          git checkout cpp/src/multipass_reverse_fold.cpp
      - name: run interleaved
        run: |
          grep -m1 "model name" /proc/cpuinfo
          for i in 1 2 3; do
            for b in base v3; do
              echo "### $b corpus"; ./$b/corpus_bench
              echo "### $b adversarial"; ./$b/adversarial_bench
            done
          done
