name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-14
            cpp: g++-14
            package: g++-14
          - compiler: clang-18
            cpp: clang++-18
            package: clang-18

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get install -y ${{ matrix.package }}

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure
