name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-14
            cpp: g++-14
            package: g++-14
          - compiler: clang-18
            cpp: clang++-18
            package: clang-18

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get install -y ${{ matrix.package }}

      - name: Configure
        run: |
          cmake -S cpp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The runners have AVX2, so the step above only ever runs the SIMD
      # split scans; this runs the same suites on the scalar fallbacks.
      - name: Test (scalar paths, SIMD disabled)
        env:
          MP_NO_SIMD: "1"
          MP_ARENA_NO_SIMD: "1"
          MP_LEAN_NO_SIMD: "1"
        run: ctest --test-dir build --output-on-failure

      - name: Cross-language output
        run: python3 bench/gen_fuzz.py && ./build/xlang bench/fuzz/well_formed.txt bench/fuzz/mutated.txt > xlang-cpp-${{ matrix.compiler }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xlang-cpp-${{ matrix.compiler }}
          path: xlang-cpp-${{ matrix.compiler }}.txt

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correctness
        run: python3 python/test_parsers.py
      - name: Differential fuzz
        run: python3 python/test_fuzz.py
      - name: Cross-language output
        run: python3 bench/gen_fuzz.py && python3 python/xlang.py bench/fuzz/well_formed.txt bench/fuzz/mutated.txt > xlang-python.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xlang-python
          path: xlang-python.txt

  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libgmp
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.10.3.0'
      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            haskell/dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('haskell/*.cabal', 'haskell/cabal.project*') }}
          restore-keys: |
            ${{ runner.os }}-cabal-
      - name: Correctness
        working-directory: haskell
        run: cabal test
      - name: Cross-language output
        working-directory: haskell
        run: python3 ../bench/gen_fuzz.py && cabal run -v0 xlang -- ../bench/fuzz/well_formed.txt ../bench/fuzz/mutated.txt > ../xlang-haskell.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xlang-haskell
          path: xlang-haskell.txt

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        working-directory: rust
        run: rustup toolchain install && rustc --version   # pinned in rust-toolchain.toml
      - name: Correctness + differential fuzz
        working-directory: rust
        run: cargo test --release -- --nocapture
      - name: Cross-language output
        working-directory: rust
        run: python3 ../bench/gen_fuzz.py && cargo run -q --release --bin xlang -- ../bench/fuzz/well_formed.txt ../bench/fuzz/mutated.txt > ../xlang-rust.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xlang-rust
          path: xlang-rust.txt

  # Every strategy in one language shares that language's lexer, so the
  # per-language fuzz above cannot catch a number-parsing bug; comparing the
  # four languages' results on the same 6 000 inputs can.
  cross-language:
    needs: [build, python, haskell, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: xlang-*
          merge-multiple: true
      - name: Compare
        run: |
          python3 bench/gen_fuzz.py
          python3 bench/xlang_compare.py bench/fuzz/well_formed.txt bench/fuzz/mutated.txt -- \
            xlang-cpp-gcc-14.txt xlang-cpp-clang-18.txt xlang-rust.txt xlang-python.txt xlang-haskell.txt
