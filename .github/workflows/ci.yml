name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-14
            cpp: g++-14
            package: g++-14
          - compiler: clang-18
            cpp: clang++-18
            package: clang-18

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get install -y ${{ matrix.package }}

      - name: Configure
        run: |
          cmake -S cpp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correctness
        run: python3 python/test_parsers.py
      - name: Differential fuzz
        run: python3 python/test_fuzz.py

  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libgmp
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'
      - name: Correctness
        working-directory: haskell
        run: cabal test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup update stable && rustc --version
      - name: Correctness + differential fuzz
        working-directory: rust
        run: cargo test --release -- --nocapture
