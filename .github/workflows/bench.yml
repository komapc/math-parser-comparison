name: bench

# Runs the four benchmark suites on a neutral GitHub-hosted runner — removes
# the local-laptop thermal throttling that makes absolute ns unreliable. Results
# land in the job summary and as a downloadable artifact.
#
# Trigger manually from the Actions tab (workflow_dispatch), or automatically on
# pushes to main that touch an implementation or the corpus generator.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'cpp/**'
      - 'python/**'
      - 'haskell/**'
      - 'rust/**'
      - 'bench/**'
      - '.github/workflows/bench.yml'

# Run bundled JS actions (checkout, upload-artifact) on Node 24, silencing the
# Node 20 deprecation notice.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bench:
    # Pinned image, not ubuntu-latest: the distro's GCC 14 and Python 3 come
    # from it, so a silent image bump would move those columns.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          {
            echo '## Runner'
            echo '```'
            lscpu | grep -E 'Model name|^CPU\(s\)|MHz' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate shared corpora
        run: python3 bench/gen_corpus.py

      # GCC only, deliberately: ci.yml's build matrix already covers clang-18
      # for correctness, but mixing compilers here would add cross-compiler
      # noise to numbers that are meant to isolate cross-language/algorithm
      # differences.
      - name: Install GCC 14 + libgmp
        run: sudo apt-get update && sudo apt-get install -y g++-14 libgmp-dev

      # ---- C++ ----
      - name: Build C++
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build -j"$(nproc)"
      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: C++ benchmark
        run: |
          set -o pipefail
          echo "nproc=$(nproc)" >> "$GITHUB_STEP_SUMMARY"
          { echo '## C++ (corpus_bench)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ./build/corpus_bench | tee bench-cpp.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: C++ adversarial chains
        run: |
          set -o pipefail
          { echo '## C++ adversarial chains'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ./build/adversarial_bench | tee adversarial-cpp.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ---- Python ----
      - name: Python benchmark (+ corpus cross-check)
        run: |
          set -o pipefail
          python3 python/test_parsers.py
          { echo '## Python'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python3 python/bench.py | tee bench-python.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Python adversarial chains
        run: |
          set -o pipefail
          { echo '## Python adversarial chains'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python3 python/adversarial.py | tee adversarial-python.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ---- Haskell ----
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.10.3.0'
      - name: Haskell benchmark (+ tests)
        working-directory: haskell
        run: |
          set -o pipefail
          cabal build all
          cabal test
          { echo '## Haskell'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cabal run -v0 bench | tee ../bench-haskell.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          { echo '## Haskell adversarial chains'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cabal run -v0 adversarial | tee ../adversarial-haskell.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ---- Rust ----
      - name: Rust benchmark (+ tests)
        working-directory: rust
        run: |
          set -o pipefail
          rustup toolchain install   # the version pinned in rust/rust-toolchain.toml
          rustc --version
          cargo test --release
          { echo '## Rust'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cargo run -q --release --bin bench | tee ../bench-rust.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          { echo '## Rust adversarial chains'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cargo run -q --release --bin adversarial | tee ../adversarial-rust.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Everything that could explain a shift between two runs, next to the
      # numbers: CPU model, image, and every toolchain's exact version.
      - name: Record environment
        if: always()
        run: |
          {
            echo "image: ${ImageOS:-?} ${ImageVersion:-?}"
            uname -a
            echo "nproc: $(nproc)"
            lscpu
            echo; g++-14 --version | head -1
            cmake --version | head -1
            python3 --version
            ghc --version || true
            cabal --version | head -1 || true
            (cd rust && rustc --version && cargo --version) || true
          } > env.txt 2>&1
          { echo '## Environment'; echo '```'; cat env.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench-*.txt
            adversarial-*.txt
            env.txt
