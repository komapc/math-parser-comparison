# TEMPORARY (tuning A/B; removed before merge): builds origin/main as `base`
# and this branch as `var`, runs both benches interleaved.
name: ab
on:
  pull_request:
  workflow_dispatch:
jobs:
  cpp:
    runs-on: ubuntu-latest
    strategy:
      matrix: { rep: [1, 2, 3, 4, 5, 6] }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get install -y g++-14
      - run: python3 bench/gen_corpus.py
      - name: build
        run: |
          git worktree add ../basewt origin/main
          for b in $([ $((i % 2)) = 1 ] && echo base var || echo var base); do
            src=$([ $b = base ] && echo ../basewt/cpp || echo cpp)
            cmake -S $src -B $b -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 >/dev/null
            cmake --build $b -j --target corpus_bench adversarial_bench >/dev/null
          done
      - name: run
        run: |
          grep -m1 "model name" /proc/cpuinfo
          for i in 1 2 3; do for b in $([ $((i % 2)) = 1 ] && echo base var || echo var base); do
            echo "### $b corpus"; ./$b/corpus_bench
            echo "### $b adversarial"; ./$b/adversarial_bench
          done; done
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: { rep: [1, 2, 3, 4, 5, 6] }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 bench/gen_corpus.py
      - name: run
        run: |
          git worktree add ../basewt origin/main
          cp -r bench/corpus ../basewt/bench/
          grep -m1 "model name" /proc/cpuinfo
          for i in 1 2; do for b in $([ $((i % 2)) = 1 ] && echo base var || echo var base); do
            d=$([ $b = base ] && echo ../basewt || echo .)
            echo "### $b corpus"; (cd $d && python3 python/bench.py)
            echo "### $b adversarial"; (cd $d && python3 python/adversarial.py)
          done; done
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix: { rep: [1, 2, 3, 4, 5, 6] }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 bench/gen_corpus.py
      - name: build
        run: |
          git worktree add ../basewt origin/main
          cp -r bench/corpus ../basewt/bench/
          (cd rust && rustup toolchain install && cargo build -q --release --bin bench --bin adversarial)
          (cd ../basewt/rust && cargo build -q --release --bin bench --bin adversarial)
      - name: run
        run: |
          grep -m1 "model name" /proc/cpuinfo
          for i in 1 2 3; do for b in $([ $((i % 2)) = 1 ] && echo base var || echo var base); do
            d=$([ $b = base ] && echo ../basewt/rust || echo rust)
            echo "### $b corpus"; (cd $d && ./target/release/bench)
            echo "### $b adversarial"; (cd $d && ./target/release/adversarial)
          done; done
